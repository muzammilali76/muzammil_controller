muzammil_f1tenth_controller:
  ros__parameters:
    # Topic interface (matches CIE-KFUPM F1TENTH V1.1 simulator)
    scan_topic: "/scan"
    odom_topic: "/ego_racecar/odom"
    drive_topic: "/drive"
    base_frame: "ego_racecar/base_link"

    # LiDAR conditioning & radial disparity inflation
    fov_half_angle_deg: 100.0
    min_range_m: 0.08
    max_horizon_m: 11.5
    smoothing_window: 5
    disparity_threshold_m: 0.35
    car_half_width_m: 0.165
    lateral_safety_margin_m: 0.115
    bubble_radius_m: 0.25

    # Steering PD + yaw-rate damping & slew rate limits
    max_steer_rad: 0.4189
    max_steer_rate_rad_s: 3.5
    kp_steer: 0.78
    kd_steer: 0.08
    kyaw_damping: 0.04
    corridor_centering_gain: 0.24
    min_gap_width_beams: 12
    gap_depth_floor_m: 1.10

    # Velocity profile & Time-To-Collision (TTC) safety bounds
    v_max_mps: 4.35
    v_min_mps: 1.50
    v_corner_mps: 1.85
    brake_decel_distance_m: 4.6
    ttc_critical_s: 0.18
    wall_repulsion_dist_m: 0.38
    wall_repulsion_gain: 0.48
    scan_timeout_s: 0.25
